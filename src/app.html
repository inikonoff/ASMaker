<style>
:root{
  --bg:#e7e9ec;--panel:#fff;--panel2:#f6f7f9;--hover:#f1f3f6;--input:#fff;--stage:#e4e6e9;--line:#e3e5e8;--line2:#c8cdd4;--cross:#a9afb8;--text:#1d2129;--muted:#6b7280;
  --acc:#2563eb;--acc-soft:#e8efff;--warn:#b45309;--bad:#e11d48;--guide:#e5399b;
  font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--text)
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{display:grid;grid-template-rows:48px 1fr}
header{display:flex;align-items:center;gap:4px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{font-weight:650;margin-right:8px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .title{cursor:text;border-radius:6px;padding:3px 6px;margin-left:-6px;max-width:320px;overflow:hidden;text-overflow:ellipsis}
.brand .title:hover{background:var(--hover);box-shadow:inset 0 0 0 1px var(--line)}
.brand input{font:inherit;font-weight:650;color:inherit;background:var(--input);height:30px;border:1px solid var(--acc);border-radius:6px;padding:0 6px;width:260px;outline:2px solid var(--acc-soft)}
textarea.txt{width:100%;height:auto;min-height:64px;padding:6px 8px;resize:vertical;line-height:1.35;font:inherit}
.seg.tog button{font-size:14px;padding:0}
.seg.tog button.on{background:var(--acc);color:#fff}
#gridPath{stroke:var(--cross)}
.pop{position:absolute;top:44px;right:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.2);padding:12px;width:260px;z-index:15}
.pop[hidden]{display:none}
.pop h5{margin:0 0 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#modal td.num,#modal th.num{text-align:right;white-space:nowrap}
#modal tr.off td{opacity:.42}
#modal .cell-in{width:100%;height:28px;border:1px solid var(--line);border-radius:6px;padding:0 6px;background:var(--input);color:inherit;font:inherit;min-width:0}
#modal .cell-in.num{text-align:right}
#modal td.in{padding:3px 4px}
#modal .est-top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:4px 0 10px}
#modal .est-top .nf{flex:none;width:170px}
#modal .total-line{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:15px;font-weight:650}
.layer .sw.none{background:repeating-conic-gradient(#e5e7eb 0 25%,#fff 0 50%) 0 0/8px 8px}
.btns.tools button{flex:1 1 0;padding:0}
.row > select{flex:1 1 0}
#modal{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:20;display:grid;place-items:center;padding:20px}
#modal[hidden]{display:none}
@media (max-width:1640px){header .tb span,.gridbtn .gtog span{display:none}}
@media (max-width:1440px){header .tb2 span{display:none}}
.acct,.acct-in{flex:none}
.dims{pointer-events:none}
.rot-stem{stroke:var(--acc);stroke-width:1;vector-effect:non-scaling-stroke}
.rot-h{fill:#fff;stroke:var(--acc);stroke-width:1.5;vector-effect:non-scaling-stroke;cursor:grab;pointer-events:all}
.rot-h:hover{fill:var(--acc)}
.dim-l{stroke:#f97316;stroke-width:1;vector-effect:non-scaling-stroke}
.dim-bg{fill:#f97316}
.dim-t{fill:#fff;font-weight:600;font-family:system-ui,sans-serif}
#ctxMenu{position:fixed;z-index:60;font-size:13px}
#ctxMenu[hidden]{display:none}
.cm-list{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.2);padding:5px;min-width:230px}
.cm-item{position:relative;display:flex;align-items:center;gap:8px;width:100%;height:30px;padding:0 8px;border:0;background:none;color:var(--text);font:inherit;text-align:left;border-radius:6px;cursor:pointer;white-space:nowrap}
.cm-item:hover:not(.off),.cm-item:focus-visible{background:var(--hover);outline:none}
.cm-item.off{opacity:.4;cursor:default}
.cm-item.danger{color:var(--bad)}
.cm-ic{width:16px;height:16px;display:grid;place-items:center;flex:none}.cm-ic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cm-l{flex:1}.cm-k{color:var(--muted);font-size:11.5px;margin-left:18px}
.cm-sep{height:1px;background:var(--line);margin:4px 6px}
.cm-item > .cm-list{display:none;position:absolute;left:calc(100% + 2px);top:-6px}
#ctxMenu.flip .cm-item > .cm-list{left:auto;right:calc(100% + 2px)}
.cm-item.has-sub:hover > .cm-list,.cm-item.has-sub:focus-within > .cm-list{display:block}
.viewseg{margin-left:6px;flex:none}.viewseg button{padding:0 10px}
@media (max-width:1380px){.viewseg button{padding:0 6px;font-size:12px}}
.gridbtn{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:6px;height:30px;flex:none}
.gridbtn button{border:0;border-radius:0;background:var(--input);color:var(--text);display:flex;align-items:center;gap:6px;padding:0 9px;font:inherit;cursor:pointer;height:100%}
.gridbtn button:hover{background:var(--hover)}
.gridbtn .gmore{padding:0 5px;border-left:1px solid var(--line)}
.gridbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gridbtn.on .gtog{background:var(--acc-soft);color:var(--acc)}
.gridbtn.dim{opacity:.5}
.gchk{display:flex;align-items:center;gap:8px;margin-top:8px;cursor:pointer}
.gstep{display:flex;gap:4px;align-items:center}
.gstep input[type=text]{width:64px;height:30px;border:1px solid var(--line);border-radius:6px;padding:0 6px;background:var(--input);color:var(--text);font:inherit}
.gstep input[type=color]{width:38px;height:30px;padding:0 2px;border:1px solid var(--line);border-radius:6px;background:var(--input)}
.gstep .btn{height:30px;padding:0 7px;font-size:12px}.gstep .btn.on{background:var(--acc-soft);color:var(--acc);border-color:var(--acc)}
.acct{border:0;background:none;padding:2px;border-radius:99px;position:relative;cursor:pointer;margin-left:4px;display:flex}
.acct .dot,.acct-st .dot{position:absolute;right:0;bottom:0;width:9px;height:9px;border-radius:50%;border:2px solid var(--panel);background:#9ca3af}
.acct-in svg{width:16px;height:16px}
.st-ok .dot,.st-idle .dot{background:#16a34a}.st-sync .dot{background:#2563eb}.st-offline .dot,.st-auth .dot{background:#d97706}.st-error .dot{background:#dc2626}
.ava{border-radius:50%;object-fit:cover;flex:none;display:inline-grid;place-items:center;background:var(--acc);color:#fff;font-weight:650}
.acct-head{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.acct-st{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--panel2);font-size:12px}
.acct-st .dot{position:static;border:0}
.acct-links{display:flex;flex-direction:column;margin-top:10px;border-top:1px solid var(--line);padding-top:6px}
.acct-links button,.linkbtn{background:none;border:0;text-align:left;padding:7px 4px;border-radius:6px;color:var(--text);font:inherit;cursor:pointer}
.acct-links button:hover,.linkbtn:hover{background:var(--hover)}
.ask-wrap{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:40;display:grid;place-items:center;padding:20px}
.ask-wrap .dlg{background:var(--panel);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(460px,100%)}
.ask-wrap .dlg-h{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:650;font-size:15px}
.ask-wrap .dlg-b{padding:0 18px 14px}.ask-wrap .dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
#sharedBar{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.12);padding:6px 8px 6px 10px;white-space:nowrap;max-width:calc(100% - 20px);overflow:auto}
#sharedBar[hidden]{display:none}
#sharedBar .btn{height:28px;font-size:12px}
.sb-tag{background:#7c3aed;color:#fff;font-size:11px;font-weight:650;padding:2px 8px;border-radius:99px}
.sb-own{color:var(--muted);font-size:12px}.sb-st{font-weight:600;font-size:12px}.sb-st.on{color:#16a34a}
body.ro #propsPane,body.ro #layersFoot,body.ro #layerList{pointer-events:none;opacity:.55}
body.ro #undoBtn,body.ro #redoBtn{opacity:.4;pointer-events:none}
.lib-tabs{flex:none}.lib-tabs button{padding:0 14px}
.lib-sync{position:absolute;top:8px;right:8px;background:var(--panel);border:1px solid var(--line);border-radius:99px;font-size:11px;padding:1px 7px;color:var(--muted)}
.lib-sync.s-ok{color:#16a34a}.lib-sync.s-conflict{color:#fff;background:#d97706;border-color:#d97706}.lib-sync.s-pending{color:#2563eb}
.lib-owner{position:absolute;bottom:8px;right:8px}
.lib-meta .busy{color:#d97706}
.lib-card.gone{opacity:.6}
.members{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.member{display:flex;align-items:center;gap:10px;padding:6px 4px;border-bottom:1px solid var(--line)}
.member select{width:auto}
ul.news{margin:4px 0 14px;padding-left:20px;line-height:1.5}
.wiz{display:grid;grid-template-columns:minmax(300px,1fr) 1.1fr;gap:22px}
.wiz-form .grid2{margin-bottom:6px}.wiz-form .check{margin:2px 0 6px}
.wiz-side{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.wiz-prev{background:var(--stage);border-radius:10px;padding:14px;display:grid;place-items:center;min-height:240px}
.wiz-prev svg{max-width:100%;height:auto;max-height:340px}
.tpl-h{margin:18px 0 10px;font-size:13px;font-weight:650}
.lib-plus svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.5}
.lib-card.tpl .lib-thumb svg{max-width:100%;max-height:100%;height:auto}
@media (max-width:760px){.wiz{grid-template-columns:1fr}}
.lib-tools{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.lib-tools input{flex:1;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--input);color:var(--text);padding:0 10px;font:inherit}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.lib-card{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0;font:inherit;color:inherit;transition:border-color .12s,box-shadow .12s}
.lib-card:hover,.lib-card:focus-visible{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft);outline:none}
.lib-card.cur{border-color:var(--acc)}
.lib-thumb{position:relative;aspect-ratio:4/3;background:var(--stage);display:grid;place-items:center;padding:10px}
.lib-thumb img{max-width:100%;max-height:100%;box-shadow:0 1px 4px rgba(0,0,0,.18);background:#fff}
.lib-badge{position:absolute;top:8px;left:8px;background:var(--acc);color:#fff;font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px}
.lib-meta{padding:9px 11px 4px;display:flex;flex-direction:column;gap:2px;min-width:0}
.lib-meta b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib-meta span{font-size:12px;color:var(--muted)}
.lib-acts{display:flex;gap:6px;padding:6px 11px 11px}
.lib-act{flex:1;height:28px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);color:var(--text);font:inherit;font-size:12px;cursor:pointer}
.lib-act:hover:not(:disabled){background:var(--hover)}
.lib-act:disabled{opacity:.4;cursor:default}
.lib-act.armed{background:#dc2626;border-color:#dc2626;color:#fff}
.lib-new{align-items:center;justify-content:center;gap:8px;min-height:220px;border-style:dashed;color:var(--muted)}
.lib-new .lib-plus{font-size:34px;line-height:1;font-weight:300}
.lib-empty{color:var(--muted);padding:30px 0;text-align:center;grid-column:1/-1}
#modal .dlg{background:var(--panel);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(900px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;min-height:0}
#modal .dlg-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:650;font-size:15px}
#modal .dlg-b{overflow:auto;padding:6px 18px 18px;flex:1;min-height:0}
#modal .dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
#modal h4{margin:16px 0 6px;font-size:13px}
#modal table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
#modal th,#modal td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
#modal th{background:var(--panel2);font-weight:600}
#modal tr.total td{font-weight:650;background:var(--panel2)}
.layer .sw.txt{border:0;font-size:12px;color:var(--text);width:22px}
.brand i{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#2563eb,#60a5fa);display:inline-block;position:relative}
.brand i::after{content:"";position:absolute;left:5px;right:5px;top:7px;bottom:4px;border:2px solid #fff;border-top:0;border-radius:0 0 2px 2px}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px;flex:none}
.spacer{flex:1}
button{font:inherit;color:inherit;background:none;border:1px solid transparent;border-radius:8px;height:32px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;transition:background .12s,transform .12s}
button:hover:not(:disabled){background:var(--hover)}
button:active:not(:disabled){transform:scale(.96)}
button:disabled{opacity:.38;cursor:default}
button.icon{width:32px;padding:0;justify-content:center}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{border-color:var(--line);background:var(--input)}
.btn.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.primary:hover:not(:disabled){background:#1d4fd8}
.btn.danger:hover:not(:disabled){color:var(--bad);border-color:#fecdd3;background:#fff1f2}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px;flex:none}
.seg button{height:26px;border-radius:6px;padding:0 10px}
.seg button.on{background:var(--acc-soft);color:var(--acc);font-weight:600}
.seg.full{display:flex;width:100%}
.seg.full button{flex:1;justify-content:center;padding:0 4px}
#zoomPct{min-width:58px;justify-content:center;font-variant-numeric:tabular-nums;padding:0 6px}
main{--lw:var(--layersW,240px);--pw:var(--propsW,296px);display:grid;grid-template-columns:16px var(--lw) 1fr var(--pw) 16px;min-height:0;position:relative}
#railL{grid-column:1;grid-row:1} #layersPane{grid-column:2;grid-row:1} #stage{grid-column:3;grid-row:1} #propsPane{grid-column:4;grid-row:1} #railR{grid-column:5;grid-row:1}
main.noL{--lw:0px} main.noL #layersPane,main.noL #layersResizer{display:none}
main.noR{--pw:0px} main.noR #propsPane,main.noR #propsResizer{display:none}
.rail{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:var(--panel2);cursor:pointer;color:var(--muted);transition:background .12s,color .12s}
#railL{border-right:1px solid var(--line)} #railR{border-left:1px solid var(--line)}
.rail:hover{background:var(--acc-soft);color:var(--acc)}
.rail svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.rail span{display:flex;flex-direction:column;align-items:center;gap:10px}
.rail i{writing-mode:vertical-rl;font-style:normal;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
#propsResizer{position:absolute;top:0;bottom:0;right:calc(16px + var(--pw));width:9px;margin-right:-5px;cursor:col-resize;z-index:6}
#layersResizer{position:absolute;top:0;bottom:0;left:calc(16px + var(--lw));width:9px;margin-left:-5px;cursor:col-resize;z-index:6}
#layersResizer:hover,#layersResizer.on,#propsResizer:hover,#propsResizer.on{background:linear-gradient(to right,transparent 3px,var(--acc) 3px,var(--acc) 6px,transparent 6px)}
aside{background:var(--panel);overflow:auto;min-height:0}
#layersPane{border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:visible}
#layerList{padding-bottom:8px;overflow:auto;flex:1;min-height:0}
#propsPane{border-left:1px solid var(--line)}
.pane-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.layer{display:flex;align-items:center;gap:2px;height:36px;padding:0 4px;margin:1px 6px;border-radius:8px;cursor:pointer;user-select:none;position:relative}
.layer:hover{background:var(--hover)}
.layer.sel{background:var(--acc-soft)}
.layer.drop-above::before,.layer.drop-below::after{content:"";position:absolute;left:6px;right:6px;height:2px;background:var(--acc);border-radius:2px}
.layer.drop-above::before{top:-2px}.layer.drop-below::after{bottom:-2px}
.layer.dragging{opacity:.4}
.layer.in-grp{margin-left:22px}
.layer.grp .nm{font-weight:600}
.gchev{width:20px!important;height:26px;display:grid;place-items:center;border:0;background:none;color:var(--muted);cursor:pointer;padding:0}
.gchev svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.gchev.closed svg{transform:rotate(-90deg)}
.layer .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.layer.hidden .nm,.layer.hidden .sw{opacity:.4}
.layer button.icon{width:26px;height:26px;border-radius:6px}
.layer button.icon svg.i{width:16px;height:16px}
.layer button.off{opacity:.35}
.layer button.on{color:var(--acc)}
.layer .sw{width:20px;height:14px;border-radius:3px;border:1px solid var(--line2);flex:none;margin:0 4px;background-size:cover;background-position:center;display:grid;place-items:center}
.layer .sw.ico{border:0;color:var(--muted)}
.layer .sw.ico svg.i{width:16px;height:16px}
.layer .tag{font-size:11px;color:var(--muted);padding-right:2px;white-space:nowrap}
.layer input.rn{height:26px;flex:1}
.layers-foot{padding:10px;border-top:1px solid var(--line);position:relative}
.layers-foot .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.layers-foot button{justify-content:center;padding:0 6px}
.layers-foot .wide{grid-column:span 2}
.soon{font-size:11px;color:var(--muted);text-align:center;margin-top:6px}
.menu{position:absolute;left:10px;bottom:calc(100% - 4px);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:4px;display:flex;flex-direction:column;min-width:200px;z-index:5}

.cap{color:var(--muted);font-size:12px;margin-bottom:4px}

.row select.fs-sel{flex:0 0 auto;width:auto}

/* ================= группы =================
   Группа — запись в doc.groups { id, name, collapsed }, у её элементов поле group. Видимость и блокировка
   группы — это видимость и блокировка всех её элементов. Элементы группы в списке слоёв всегда идут подряд. */
const groupOf = o => o && o.group && (doc.groups || []).find(g => g.id === o.group);
const membersOf = gid => doc.objects.filter(o => o.group === gid);
/* убирает пустые и одиночные группы и собирает элементы каждой группы подряд — у самого верхнего */
function cleanGroups() {
  if (!Array.isArray(doc.groups)) doc.groups = [];
  const cnt = new Map(); for (const o of doc.objects) if (o.group) cnt.set(o.group, (cnt.get(o.group) || 0) + 1);
  for (const o of doc.objects) if (o.group && ((cnt.get(o.group) || 0) < 2 || !doc.groups.some(g => g.id === o.group))) delete o.group;
  doc.groups = doc.groups.filter(g => (cnt.get(g.id) || 0) >= 2);
  for (const g of doc.groups) {
    const arr = doc.objects, idx = arr.map((o, i) => o.group === g.id ? i : -1).filter(i => i >= 0);
    if (idx[idx.length - 1] - idx[0] === idx.length - 1) continue; // уже подряд
    const mem = idx.map(i => arr[i]), top = idx[idx.length - 1], rest = arr.filter(o => o.group !== g.id);
    const at = rest.indexOf(arr.slice(0, top).filter(o => o.group !== g.id).pop()) + 1;
    rest.splice(Math.max(1, at), 0, ...mem); doc.objects = rest;
  }
}
function groupSel() {

  mutate(null, () => {

    doc.groups = (doc.groups || []).concat({ id: gid, name: 'Группа ' + n, collapsed: false });
    for (const o of list) byId(o.id).group = gid;
    if (old.size) toast('Элементы перенесены в новую группу');
  });
  setSel(list.map(o => o.id)); toast('Группа создана: клик выделяет её целиком, второй клик — отдельный элемент. Разгруппировать — Ctrl+Shift+G');
}
function ungroupSel() {
  const gids = new Set(selected().map(o => o.group).filter(Boolean)); if (!gids.size) return toast('В выделении нет групп');
  mutate(null, () => { for (const o of doc.objects) if (gids.has(o.group)) delete o.group; doc.groups = doc.groups.filter(g => !gids.has(g.id)); });

/* ================= keyboard ================= */
window.addEventListener('keydown', e => {
  const t = e.target, typing = /INPUT|TEXTAREA|SELECT/.test(t.tagName) || t.isContentEditable;
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.code === 'KeyS') { e.preventDefault(); saveFile(e.shiftKey); return; }
  if (mod && e.code === 'KeyO') { e.preventDefault(); e.shiftKey ? openLibrary() : pickProjectFile(); return; }
  if (mod && e.shiftKey && e.code === 'KeyE') { e.preventDefault(); openExport(); return; }
  if (typing) return;
  if (readOnly && !/^(Digit0|Digit1|Numpad0|Numpad1|Equal|Minus|NumpadAdd|NumpadSubtract|Escape|Space)$/.test(e.code)) return;
  if (mod && e.code === 'KeyZ') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.code === 'KeyY') { e.preventDefault(); redo(); return; }
  if (mod && e.code === 'KeyD') { e.preventDefault(); duplicateSel(); return; }
  if (mod && e.code === 'KeyA') { e.preventDefault(); setSel(doc.objects.filter(o => isBox(o) && o.visible && !o.locked).map(o => o.id)); return; }
  if (mod && e.code === 'KeyG') { e.preventDefault(); e.shiftKey ? ungroupSel() : groupSel(); return; }
  if (mod && e.altKey && e.code === 'KeyC') { e.preventDefault(); copyStyle(); return; }
  if (mod && e.altKey && e.code === 'KeyV') { e.preventDefault(); pasteStyle(); return; }
  if (!mod && !e.altKey && e.code === 'KeyD' && !e.shiftKey) { e.preventDefault(); showDims.on = !showDims.on; try { localStorage.setItem(STORE + ':dims', JSON.stringify(showDims.on)); } catch {} invalidate('overlay'); toast(showDims.on ? 'Размеры и расстояния показаны (D)' : 'Размеры и расстояния скрыты (D)'); return; }
  if (!mod && !e.altKey && e.code === 'KeyV') { e.preventDefault(); setViewMode(isClient() ? 'prod' : 'client'); toast(isClient() ? 'Вид для клиента (V)' : 'Производственный вид (V)'); return; }
  if (!mod && !e.altKey && e.code === 'KeyG') { e.preventDefault(); setGrid(g => g.on = !g.on); return; }
  if (mod && (e.code === 'Equal' || e.code === 'NumpadAdd')) { e.preventDefault(); zoomBy(1.25); return; }
  if (mod && (e.code === 'Minus' || e.code === 'NumpadSubtract')) { e.preventDefault(); zoomBy(1 / 1.25); return; }
  if (mod) return;
  switch (e.code) {
    case 'Space': e.preventDefault(); if (!spaceDown) { spaceDown = true; stage.classList.add('space'); } return;
    case 'Equal': case 'NumpadAdd': zoomBy(1.25); return;
    case 'Minus': case 'NumpadSubtract': zoomBy(1 / 1.25); return;
    case 'Digit0': case 'Numpad0': fit(); return;
    case 'Digit1': case 'Numpad1': realSize(); return;
    case 'Escape': select(null); return;
    case 'Delete': case 'Backspace': e.preventDefault(); deleteSel(); return;
    case 'KeyR': if (sel) { e.preventDefault(); rotateSel(e.shiftKey ? -1 : 1); } return;
    case 'KeyH': if (sel && e.shiftKey) { e.preventDefault(); flipSel(); } return;
  }
  const arrows = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.code];
  const o = sel && byId(sel), boxes = selected().filter(x => isBox(x) && !x.locked);
  if (arrows && boxes.length > 1) { e.preventDefault(); const s = e.shiftKey ? 10 : 1; mutate('nudge', () => { for (const b of boxes) { const x = byId(b.id); x.x += arrows[0] * s; x.y += arrows[1] * s; } }); return; }
  if (arrows && o && !o.locked) {
    const s = e.shiftKey ? 10 : 1;
    if (isBox(o)) { e.preventDefault(); mutate('nudge', () => { const x = byId(o.id); x.x += arrows[0] * s; x.y += arrows[1] * s; }); }
    else if (o.type === 'base' && o.image) { e.preventDefault(); mutate('nudge', () => { const im = byId(o.id).image; im.x += arrows[0] * s; im.y += arrows[1] * s; }); }
  }
});

const SEEN_KEY = STORE + ':seen';
function openWhatsNew() {
  const m = $('#modal'), close = () => { m.hidden = true; m.replaceChildren(); };
  lsSet(SEEN_KEY, WHATS_NEW[0].v);
  m.replaceChildren(el('div', { class: 'dlg', role: 'dialog', style: 'width:min(560px,100%)' },
    el('div', { class: 'dlg-h' }, el('span', {}, 'Что нового в ASMaker'), B('', '✕', close, { cls: 'icon', title: 'Закрыть (Esc)' })),
    el('div', { class: 'dlg-b', style: 'padding-top:6px' }, WHATS_NEW.map(r => [cap(r.date), el('ul', { class: 'news' }, r.items.map(t => el('li', {}, t)))]))));
  m.hidden = false; m.onclick = e => { if (e.target === m) close(); };
}
function maybeWhatsNew() { const s = lsGet(SEEN_KEY, null); if (s === WHATS_NEW[0].v) return; if (s || hadStored) setTimeout(openWhatsNew, 800); else lsSet(SEEN_KEY, WHATS_NEW[0].v); }

async function cloudInit() {
  renderAccount();
  const p = new URLSearchParams(location.search), open = p.get('open');
  if (open) { history.replaceState(null, '', location.pathname + location.hash); }
  const r = pid && await projects.get(pid).catch(() => null);
  if (open) openFromLink(open);
  else if (r && r.kind === 'shared') { if (account && tokenOk()) openShared(pid); else { cur = { shared: true, id: pid, file: r.drive.file, canEdit: false, owner: r.drive.owner, isOwner: r.drive.isOwner, mode: 'view', lock: null }; setReadOnly(true); toast('Общий проект открыт для просмотра. Войдите, чтобы работать с ним', 5000); } }
  else maybeWhatsNew();
  if (account && tokenOk()) { cloudKick(1500); pullAll(); } else if (account) setCloud('auth');
}

/* ================= theme ================= */
const THEME_KEY = STORE + ':theme';
const theme = (() => { try { return Object.assign({ dark: false, level: 50 }, JSON.parse(localStorage.getItem(THEME_KEY))); } catch { return { dark: false, level: 50 }; } })();
const THEME_VARS = ['--bg', '--panel', '--panel2', '--hover', '--input', '--stage', '--line', '--line2', '--cross', '--text', '--muted', '--acc', '--acc-soft'];
function applyTheme() {
  const r = document.documentElement.style;
  if (!theme.dark) { THEME_VARS.forEach(v => r.removeProperty(v)); r.colorScheme = 'light'; return; }
  const L = 27 - theme.level / 100 * 17, c = (l, sat = 9) => `hsl(220 ${sat}% ${clamp(l, 2, 60)}%)`; // от графитового (27%) до почти чёрного (10%)
  const vals = { '--bg': c(L - 5), '--panel': c(L), '--panel2': c(L + 4), '--hover': c(L + 7), '--input': c(L - 3), '--stage': c(L - 6), '--line': c(L + 9), '--line2': c(L + 17),
    '--cross': c(L + 18), '--text': '#e7e9ee', '--muted': '#9ba3ae', '--acc': '#5b93f5', '--acc-soft': 'rgba(91,147,245,.22)' };
  for (const [k, v] of Object.entries(vals)) r.setProperty(k, v);
  r.colorScheme = 'dark';
}
function saveTheme() { try { localStorage.setItem(THEME_KEY, JSON.stringify(theme)); } catch {} applyTheme(); }
const themeLevel = el('input', { type: 'range', min: 0, max: 100, value: theme.level, style: 'width:100%;accent-color:var(--acc)', title: 'Двойной клик — по умолчанию' });
const themeSeg = el('div', { class: 'seg full' });
function renderThemeSeg() {
  themeSeg.replaceChildren(...[[false, 'Светлая'], [true, 'Тёмная']].map(([d, l]) => el('button', { type: 'button', class: theme.dark === d ? 'on' : '', onclick: () => { theme.dark = d; saveTheme(); renderThemeSeg(); } }, l)));
  themeLevel.disabled = !theme.dark;
}
themeLevel.addEventListener('input', () => { theme.level = +themeLevel.value; saveTheme(); });
themeLevel.addEventListener('dblclick', () => { theme.level = 50; themeLevel.value = 50; saveTheme(); });
const themePop = el('div', { class: 'pop', hidden: true }, el('h5', {}, 'Тема'), row(themeSeg), el('h5', { style: 'margin-top:12px' }, 'Насыщенность тёмной темы'), themeLevel,
  el('div', { class: 'cap', style: 'display:flex;justify-content:space-between;margin-top:2px' }, el('span', {}, 'графит'), el('span', {}, 'почти чёрный')));
document.body.append(themePop);
themePop.append(el('label', { class: 'gchk', style: 'margin-top:12px' }, (() => { const i = el('input', { type: 'checkbox' }); i.checked = colorHints.on; i.onchange = () => { colorHints.on = i.checked; try { localStorage.setItem(STORE + ':colorHints', JSON.stringify(i.checked)); } catch {} propsSig = null; invalidate('props'); }; return i; })(), 'Подсказывать цвета'),
  el('button', { type: 'button', class: 'linkbtn', style: 'margin-top:8px', onclick: () => { themePop.hidden = true; openWhatsNew(); } }, 'Что нового в ASMaker'));
document.addEventListener('pointerdown', e => { if (!themePop.hidden && !themePop.contains(e.target) && !$('#themeBtn').contains(e.target)) themePop.hidden = true; });
renderThemeSeg(); applyTheme();

/* ================= collapsible side panels ================= */
const PANES_KEY = STORE + ':panes';
const panes = (() => { try { return Object.assign({ L: true, R: true }, JSON.parse(localStorage.getItem(PANES_KEY))); } catch { return { L: true, R: true }; } })();
const CHEV = { left: '<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>', right: '<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>' };
function renderPanes() {
  const m = $('main'); m.classList.toggle('noL', !panes.L); m.classList.toggle('noR', !panes.R);
  $('#railL').innerHTML = `<span>${panes.L ? CHEV.left : CHEV.right}<i>${panes.L ? 'скрыть слои' : 'слои'}</i></span>`;
  $('#railL').title = panes.L ? 'Скрыть панель слоёв' : 'Показать панель слоёв';
  $('#railR').innerHTML = `<span>${panes.R ? CHEV.right : CHEV.left}<i>${panes.R ? 'скрыть свойства' : 'свойства'}</i></span>`;
  $('#railR').title = panes.R ? 'Скрыть панель свойств' : 'Показать панель свойств';
}
for (const k of ['L', 'R']) $('#rail' + k).addEventListener('click', () => { panes[k] = !panes[k]; try { localStorage.setItem(PANES_KEY, JSON.stringify(panes)); } catch {} renderPanes(); });
renderPanes();

/* ================= resizable layers panel ================= */
const layersRz = el('div', { id: 'layersResizer', title: 'Тяните, чтобы изменить ширину панели слоёв. Двойной клик — по умолчанию' });
function setLayersW(w, save = true) {
  w = clamp(Math.round(w), 180, Math.min(460, window.innerWidth - 600));
  $('main').style.setProperty('--layersW', w + 'px');
  if (save) try { localStorage.setItem(STORE + ':layersW', String(w)); } catch {}
}
try { setLayersW(+localStorage.getItem(STORE + ':layersW') || 240, false); } catch { setLayersW(240, false); }
layersRz.addEventListener('pointerdown', e => {
  e.preventDefault(); layersRz.setPointerCapture(e.pointerId); layersRz.classList.add('on');
  const mv = ev => setLayersW(ev.clientX - $('main').getBoundingClientRect().left - 16);
  const up = () => { layersRz.removeEventListener('pointermove', mv); layersRz.classList.remove('on'); };
  layersRz.addEventListener('pointermove', mv); layersRz.addEventListener('pointerup', up, { once: true }); layersRz.addEventListener('pointercancel', up, { once: true });
});
layersRz.addEventListener('dblclick', () => setLayersW(240));
$('main').append(layersRz);

/* ================= resizable properties panel ================= */
const mainEl = $('main'), propsRz = el('div', { id: 'propsResizer', title: 'Тяните, чтобы изменить ширину панели. Двойной клик — по умолчанию' });
mainEl.append(propsRz);
function setPropsW(w, save = true) {
  w = clamp(Math.round(w), 240, Math.min(680, window.innerWidth - 480));
  mainEl.style.setProperty('--propsW', w + 'px');
  if (save) try { localStorage.setItem(STORE + ':propsW', String(w)); } catch {}
}
try { setPropsW(+localStorage.getItem(STORE + ':propsW') || 296, false); } catch { setPropsW(296, false); }
propsRz.addEventListener('pointerdown', e => {
  e.preventDefault(); propsRz.setPointerCapture(e.pointerId); propsRz.classList.add('on');
  const mv = ev => setPropsW(mainEl.getBoundingClientRect().right - 16 - ev.clientX);
  const up = () => { propsRz.removeEventListener('pointermove', mv); propsRz.classList.remove('on'); };
  propsRz.addEventListener('pointermove', mv); propsRz.addEventListener('pointerup', up, { once: true }); propsRz.addEventListener('pointercancel', up, { once: true });
});
propsRz.addEventListener('dblclick', () => setPropsW(296));

/* ================= start ================= */
loadStored();
sel = base().id; selIds = [sel];
libInit().then(cloudInit);
if (document.fonts) document.fonts.ready.then(relayoutTexts);
try { fontStore.all().then(loadCustomFonts, () => {}); } catch {}
invalidate('all');
requestAnimationFrame(() => { fit(); flush(); });
let fitted = false;
new ResizeObserver(() => { if (!fitted && stage.clientWidth) { fitted = true; fit(); } else invalidate('view'); }).observe(stage);
</script>
